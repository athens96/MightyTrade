# MightyTrade 배포 설정 — scripts/deploy.sh (Mighty 앱 공통)가 읽는다.
# remote_* 함수는 VM 에서 $APP_DIR 안에서 실행된다.
APP=mighty-trade
APP_DIR=/opt/mighty-trade
REPO_URL=https://github.com/athens96/MightyTrade.git
DOMAIN=mightytrade.duckdns.org
SERVICE=mighty-trade-api           # deploy/$SERVICE.service, 127.0.0.1:5001
HEALTH_PATH=/api/health
HEALTH_OK=200

remote_prereqs() { :; }

remote_install() {
  mkdir -p server-rs
  if [ -f server-rs/mighty-trade-server.new ]; then
    chmod 755 server-rs/mighty-trade-server.new
    mv -f server-rs/mighty-trade-server.new server-rs/mighty-trade-server
  elif [ ! -x server-rs/mighty-trade-server ]; then
    command -v cargo >/dev/null 2>&1 || { echo "! server-rs/mighty-trade-server 바이너리가 없습니다 (DEPLOY_SERVER_BIN 필요)" >&2; exit 1; }
    (cd server-rs && cargo build --release && cp target/release/mighty-trade-server mighty-trade-server)
  fi
}

# server/.env 는 자동 생성하지 않는다 (ENCRYPTION_KEY 등은 README 대로 직접 작성·백업).
