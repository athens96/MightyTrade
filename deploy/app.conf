# MightyTrade 배포 설정 — scripts/deploy.sh (Mighty 앱 공통)가 읽는다.
# remote_* 함수는 VM 에서 $APP_DIR 안에서 실행된다.
APP=mighty-trade
APP_DIR=/opt/mighty-trade
REPO_URL=https://github.com/athens96/MightyTrade.git
DOMAIN=mightytrade.duckdns.org
SERVICE=mighty-trade-api           # deploy/$SERVICE.service, 127.0.0.1:5001
HEALTH_PATH=/api/auth/me
HEALTH_OK=401                      # 로그인 전 401 = 정상

remote_prereqs() { :; }

remote_install() {
  [ -x server/.venv/bin/pip ] || python3 -m venv server/.venv
  server/.venv/bin/pip install -q -r server/requirements.txt
}

# server/.env 는 자동 생성하지 않는다 (ENCRYPTION_KEY 등은 README 대로 직접 작성·백업).
