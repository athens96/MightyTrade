# /etc/nginx/sites-available/mighty-trade
# Client (static build) and API on the same origin -> cookies work with SameSite=Strict, no CORS.
# If client and server run on separate Oracle VMs, point proxy_pass at the server VM's private IP.
server {
    listen 80;
    server_name mightytrade.duckdns.org;   # = deploy/app.conf DOMAIN. `deploy.sh setup` adds HTTPS via certbot

    root /opt/mighty-trade/client/dist;
    index index.html;

    # Server-Sent Events (live orderbook/ticks): no buffering, long-lived connections
    location /api/realtime/ {
        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed build assets never change: cache for a year
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # not in nginx's mime.types
    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }

    # SPA fallback. index.html must be revalidated, or browsers keep pointing at deleted assets after a deploy.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
