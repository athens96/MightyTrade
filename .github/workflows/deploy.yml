name: Deploy to OCI

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: oci-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Test, Build (Rust + Vite) & Deploy to OCI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: server-rs

      - name: Run Rust backend tests (cargo test)
        working-directory: server-rs
        run: cargo test

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Run frontend tests (vitest)
        working-directory: client
        run: |
          npm ci
          npm test

      - name: Configure SSH credentials
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          if [ -n "$DEPLOY_KNOWN_HOSTS" ]; then
            printf '%s\n' "$DEPLOY_KNOWN_HOSTS" >> "$HOME/.ssh/known_hosts"
          else
            ssh-keyscan -H "${DEPLOY_HOST#*@}" >> "$HOME/.ssh/known_hosts"
          fi
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Detect OCI VM architecture
        id: arch
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          REMOTE_ARCH="$(ssh -i "$HOME/.ssh/deploy_key" -o BatchMode=yes "$DEPLOY_HOST" 'uname -m')"
          REMOTE_GLIBC="$(ssh -i "$HOME/.ssh/deploy_key" -o BatchMode=yes "$DEPLOY_HOST" 'ldd --version | head -n1')"
          echo "OCI VM arch: $REMOTE_ARCH | $REMOTE_GLIBC"
          if [ "$REMOTE_ARCH" = "aarch64" ] || [ "$REMOTE_ARCH" = "arm64" ]; then
            echo "rust_target=aarch64-unknown-linux-gnu" >> "$GITHUB_OUTPUT"
            echo "zig_target=aarch64-unknown-linux-gnu.2.31" >> "$GITHUB_OUTPUT"
          else
            echo "rust_target=x86_64-unknown-linux-gnu" >> "$GITHUB_OUTPUT"
            echo "zig_target=x86_64-unknown-linux-gnu.2.31" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Zig & cargo-zigbuild
        uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0

      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@cargo-zigbuild

      - name: Build Rust release binary for OCI (${{ steps.arch.outputs.zig_target }})
        working-directory: server-rs
        run: |
          rustup target add "${{ steps.arch.outputs.rust_target }}"
          cargo zigbuild --release --target "${{ steps.arch.outputs.zig_target }}"
          BIN="target/${{ steps.arch.outputs.rust_target }}/release/mighty-trade-server"
          ls -lh "$BIN"
          file "$BIN"

      - name: Deploy to OCI via scripts/deploy.sh
        env:
          DEPLOY_YES: '1'
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
        run: |
          DEPLOY_KEY="$HOME/.ssh/deploy_key" \
          DEPLOY_SERVER_BIN="$PWD/server-rs/target/${{ steps.arch.outputs.rust_target }}/release/mighty-trade-server" \
          ./scripts/deploy.sh update

      - name: Verify live /api/health version
        run: |
          EXPECTED="$(tr -d '[:space:]' < VERSION)"
          BODY="$(curl -fsS --max-time 15 https://mightytrade.duckdns.org/api/health)"
          echo "Live /api/health: $BODY"
          python3 -c 'import json, sys; d = json.loads(sys.argv[1]); assert d.get("status") == "ok" and d.get("version") == sys.argv[2], (d, sys.argv[2])' "$BODY" "$EXPECTED"
