[package]
name = "mighty-trade-server"
version = "0.3.1"
edition = "2021"
description = "MightyTrade async Rust backend server (Axum + Tokio + SQLite)"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
axum-extra = { version = "0.10", features = ["cookie"] }
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "charset", "http2", "cookies"] }
encoding_rs = "0.8"
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
time = "0.3"
uuid = { version = "1", features = ["v4"] }
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
regex = "1"
once_cell = "1"
fs2 = "0.4"
jsonwebtoken = "9"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
aes-gcm = "0.10"
rsa = { version = "0.9", features = ["sha2", "pem"] }
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
base64 = "0.22"
data-encoding = "2"
subtle = "2"
rand = "0.8"
rand_chacha = "0.3"
rayon = "1.10"
url = "2"
urlencoding = "2"
tempfile = "3"
parking_lot = "0.12"
dashmap = "6"
async-trait = "0.1"

[dev-dependencies]
http-body-util = "0.1"
hyper = "1"

[profile.dev.package.num-bigint-dig]
opt-level = 3

[profile.dev.package.rsa]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
